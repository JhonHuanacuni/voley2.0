<script>
(function () {
    const searchInput = document.getElementById('payment-student-search');
    const studentIdInput = document.getElementById('id_student_id');
    const confirmInput = document.getElementById('id_confirm_new_membership');
    const resultsBox = document.getElementById('payment-student-search-results');
    const statusBox = document.getElementById('payment-student-status');
    const form = document.getElementById('payment-create-form');
    const amountInput = document.getElementById('id_amount');
    if (!searchInput || !studentIdInput || !resultsBox || !form) return;

    let timer = null;
    let studentBalance = 0;
    let studentStatus = '';

    function hideResults() {
        resultsBox.innerHTML = '';
        resultsBox.classList.add('d-none');
    }

    function hideStatus() {
        statusBox.classList.add('d-none');
        statusBox.textContent = '';
        statusBox.classList.remove('alert-success', 'alert-warning', 'alert-info');
    }

    function showStatus(data) {
        studentBalance = parseFloat(data.balance) || 0;
        studentStatus = data.status || '';
        statusBox.textContent = data.message || '';
        statusBox.classList.remove('d-none', 'alert-success', 'alert-warning', 'alert-info');
        if (data.status === 'completed') {
            statusBox.classList.add('alert-success');
        } else if (data.status === 'debt') {
            statusBox.classList.add('alert-warning');
        } else {
            statusBox.classList.add('alert-info');
        }
    }

    function fetchStatus(studentId) {
        fetch('{% url "student_payment_status" 0 %}'.replace('/0/', '/' + studentId + '/'))
            .then(function (r) { return r.json(); })
            .then(showStatus)
            .catch(function () {
                hideStatus();
            });
    }

    function selectStudent(id, label) {
        studentIdInput.value = id;
        searchInput.value = label;
        if (confirmInput) confirmInput.value = '';
        hideResults();
        fetchStatus(id);
    }

    searchInput.addEventListener('input', function () {
        const q = searchInput.value.trim();
        if (q.length < 3) {
            studentIdInput.value = '';
            if (confirmInput) confirmInput.value = '';
            studentBalance = 0;
            studentStatus = '';
            hideResults();
            hideStatus();
            return;
        }
        clearTimeout(timer);
        timer = setTimeout(function () {
            fetch('{% url "membership_student_search" %}?q=' + encodeURIComponent(q))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    resultsBox.innerHTML = '';
                    if (!data.results || !data.results.length) {
                        resultsBox.innerHTML = '<div class="list-group-item text-muted">Sin coincidencias</div>';
                        resultsBox.classList.remove('d-none');
                        return;
                    }
                    data.results.forEach(function (item) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'list-group-item list-group-item-action';
                        btn.textContent = item.label;
                        btn.addEventListener('click', function () {
                            selectStudent(item.id, item.label);
                        });
                        resultsBox.appendChild(btn);
                    });
                    resultsBox.classList.remove('d-none');
                });
        }, 250);
    });

    document.addEventListener('click', function (e) {
        if (!resultsBox.contains(e.target) && e.target !== searchInput) {
            hideResults();
        }
    });

    form.addEventListener('submit', function (e) {
        if (!studentIdInput.value) return;
        const amount = parseFloat(amountInput && amountInput.value) || 0;
        const needsConfirm = studentStatus === 'debt' && studentBalance > 0 && amount > studentBalance;
        if (!needsConfirm) {
            if (confirmInput) confirmInput.value = '';
            return;
        }
        if (confirmInput && confirmInput.value === '1') {
            return;
        }
        e.preventDefault();
        Swal.fire({
            icon: 'warning',
            title: 'Crear nueva membresía',
            text: 'Este usuario ya tiene una deuda, ¿está seguro que quiere crear otra membresía?',
            showCancelButton: true,
            confirmButtonText: 'Sí, continuar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#e74a3b',
        }).then(function (result) {
            if (result.isConfirmed) {
                if (confirmInput) confirmInput.value = '1';
                form.submit();
            }
        });
    });
})();
</script>
