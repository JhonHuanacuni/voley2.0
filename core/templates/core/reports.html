{% extends 'core/base.html' %}
{% block content %}
<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Reportes</h1>
</div>
<div class="row">
    <div class="col-lg-12 mb-4">
        <div class="card shadow">
            <div class="card-body">
                <form method="get" class="form-row align-items-end">
                    <div class="col-md-4">
                        <label for="report_student">Alumna</label>
                        <select id="report_student" name="student" class="form-control">
                            <option value="">Todas las alumnas</option>
                            {% for student in students %}
                                <option value="{{ student.id }}"{% if selected_student == student.id|stringformat:'s' %} selected{% endif %}>{{ student.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="report_shift">Turno</label>
                        <select id="report_shift" name="shift" class="form-control">
                            <option value="">Todos los turnos</option>
                            {% for value, label in shift_choices %}
                                <option value="{{ value }}"{% if selected_shift == value %} selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary btn-block">Aplicar filtro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-lg-4 mb-4">
        <div class="card shadow h-100">
            <div class="card-body">
                <h5 class="card-title">Alumnas</h5>
                <p class="card-text">Descarga el listado completo de alumnas registradas.</p>
                <a class="btn btn-primary" href="{% url 'export_students_xlsx' %}{% if selected_student %}?student={{ selected_student }}{% endif %}">Exportar Excel</a>
            </div>
        </div>
    </div>
    <div class="col-lg-4 mb-4">
        <div class="card shadow h-100">
            <div class="card-body">
                <h5 class="card-title">Asistencia</h5>
                <p class="card-text">Exporta el registro de asistencia en formato .xlsx.</p>
                <a class="btn btn-primary" href="{% url 'export_attendance_xlsx' %}{% if selected_student or selected_shift %}?{% endif %}{% if selected_student %}student={{ selected_student }}{% endif %}{% if selected_student and selected_shift %}&{% endif %}{% if selected_shift %}shift={{ selected_shift }}{% endif %}">Exportar Excel</a>
            </div>
        </div>
    </div>
    <div class="col-lg-4 mb-4">
        <div class="card shadow h-100">
            <div class="card-body">
                <h5 class="card-title">Pagos</h5>
                <p class="card-text">Descarga el historial de pagos.</p>
                <a class="btn btn-primary" href="{% url 'export_payments_xlsx' %}{% if selected_student %}?student={{ selected_student }}{% endif %}">Exportar Excel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
